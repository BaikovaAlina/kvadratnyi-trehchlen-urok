<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Квадратный трёхчлен — интерактивный урок</title>
<meta name="description" content="Интерактивная учебная презентация: график параболы по точкам, знаки коэффициентов a и c, дискриминант, корни квадратного трёхчлена.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231C2E7A'/%3E%3Cpath d='M6 6 Q16 42 26 6' fill='none' stroke='%23FFE46B' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#FCFBF5; --grid:#D9E5EF; --ink:#1C2E7A; --ink2:#3450C8; --text:#1B1F2E; --muted:#596178;
  --red:#C5302A; --red-bg:#FCE8E5; --green:#167A4B; --green-bg:#E2F3E9; --hl:#FFE46B; --amber:#8A5A00; --amber-bg:#FFF3C9;
  --line:#C9D0E4; --card:#fff;
  --sans:"PT Sans","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"PT Serif","Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
  --math:Cambria,"PT Serif",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;font-family:var(--sans);color:var(--text);background:var(--paper);font-size:clamp(16px,.5vw + 11.5px,20px);line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ink2);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);color:var(--ink);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:clamp(1.5rem,2.6vw,2.2rem)}
h3{font-size:1.05rem}
p{margin:0}
i,.m{font-family:var(--math);font-size:1.1em}
.m i,.formula i,.sol i,.field i,.seg-b i,table.vals i,.sl i,h1 i,h2 i,h3 i,.frac i,.mini figcaption b i{font-size:1em}
.nb{white-space:nowrap}
sup,sub{line-height:0}
mark{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);color:inherit;padding:0 .08em;white-space:nowrap}

/* ---------- каркас ---------- */
.top{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:2px solid var(--ink);z-index:2}
.brand{border:0;background:none;padding:4px 6px;font-family:var(--math);font-size:1.15rem;font-style:italic;color:var(--ink);white-space:nowrap;border-radius:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:3px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:.45em;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:.28em .8em .28em .32em;font-size:.86rem;color:var(--text);white-space:nowrap}
.tab .num{display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:#EEF1FA;color:var(--ink);font-weight:700;font-size:.9em}
.tab .cnt{color:var(--muted);font-size:.85em;font-variant-numeric:tabular-nums}
.tab:hover{border-color:var(--ink)}
.tab[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab[aria-current="true"] .num{background:var(--hl);color:var(--ink)}
.tab[aria-current="true"] .cnt{color:#C9D3FA}
.tab.full .num{background:var(--green);color:#fff}
.icon-btn{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:8px;width:2.3em;height:2.3em;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{border-color:var(--ink)}

.stage{flex:1;overflow:auto;position:relative;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:local}
.slide{max-width:1160px;margin:0 auto;padding:clamp(18px,3vw,40px) clamp(14px,3vw,36px) 48px;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.bar{flex:none;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:5px 14px;background:#fff;border-top:1px solid var(--line)}
.bar .mid{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0;flex:1}
.dots{display:flex;gap:7px;overflow-x:auto;max-width:100%;padding:6px 7px;scrollbar-width:none}
.dots::-webkit-scrollbar{display:none}
.dot{flex:none;width:2em;height:2em;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:.8rem;font-weight:700;color:var(--muted);padding:0;font-variant-numeric:tabular-nums}
.dot:hover{border-color:var(--ink)}
.dot.ok{background:var(--green);border-color:var(--green);color:#fff}
.dot.hint{background:var(--amber-bg);border-color:#D9B44A;color:var(--amber)}
.dot[aria-current="true"]{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink);border-color:var(--ink);color:var(--ink)}
.dot.ok[aria-current="true"]{color:#fff}
.pos{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- кнопки ---------- */
.btn{border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:.55em 1.1em;font-weight:700;white-space:nowrap;transition:transform .08s,background .15s}
.btn:hover{background:#142363}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.ghost:hover{background:#EEF1FA}
.btn.big{font-size:1.1rem;padding:.7em 1.5em}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.go{animation:pulse 1.4s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(52,80,200,.22)}}
.linkbtn{border:0;background:none;padding:.4em .2em;color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px;font-size:.9rem}
.linkbtn:hover{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}

/* ---------- типовые блоки ---------- */
.kicker{font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:.5em}
.lead{font-size:1.1rem;max-width:46em;margin-top:.7em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:clamp(14px,2vw,24px);box-shadow:0 1px 0 rgba(28,46,122,.06),0 8px 24px -18px rgba(28,46,122,.45)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,2.5vw,32px);align-items:start;margin-top:1.1em}
.split.wide-left{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}
@media (max-width:860px){.split,.split.wide-left{grid-template-columns:1fr}}
@media (min-width:861px) and (min-height:560px){.sticky{position:sticky;top:12px}}
.formula{font-family:var(--math);font-size:clamp(1.7rem,4vw,2.7rem);color:var(--ink);line-height:1.25;margin:.35em 0 .1em;white-space:nowrap}
.formula.mid{font-size:clamp(1.25rem,2.4vw,1.6rem)}
.plotcard>.formula{margin:.1em .4em .2em}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.2;margin:0 .12em;font-size:.92em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .3em .05em}
.frac>span:last-child{padding:.05em .3em 0}
.rad{border-top:1.5px solid currentColor;padding:0 .1em}
.note{border-left:4px solid var(--hl);background:#FFFBE6;padding:.6em .9em;border-radius:0 8px 8px 0;font-size:.95rem}
.list{margin:.6em 0 0;padding-left:1.25em}
.list li{margin:.35em 0}
.sub{color:var(--muted);font-size:.93rem}

/* ---------- графики ---------- */
.plot{display:block;width:100%;height:auto;margin:0 auto;max-height:max(300px,calc(100vh - 300px));touch-action:manipulation;user-select:none;-webkit-user-select:none}
.plot.active{cursor:crosshair}
.plot.tall{max-height:max(280px,calc(100vh - 390px))}
@media (max-width:860px){.plot.tall{max-height:none}}
.p-bg{fill:#fff}
.p-grid line{stroke:#DCE5EF;stroke-width:1}
.p-axes path{stroke:var(--text);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.p-lab text{font-family:var(--math);fill:#3A4158}
.p-lab .it{font-style:italic;font-weight:700;fill:var(--text)}
.p-curve{fill:none;stroke:var(--ink2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.p-dot{fill:var(--ink);stroke:#fff;stroke-width:2}
.p-dot.bad{fill:var(--red);animation:blink .9s ease both}
@keyframes blink{0%,60%{opacity:1}100%{opacity:0}}
.p-ghost{fill:var(--ink2);opacity:.28;pointer-events:none}
.p-sym{stroke:var(--red);stroke-width:1.5;stroke-dasharray:6 5}
.p-mark{fill:var(--red);stroke:#fff;stroke-width:2.5}
.p-txt{font-family:var(--math);font-weight:700;fill:var(--red);paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.plotcard{padding:10px}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px;margin-top:.8em}
.mini{margin:0;text-align:center}
.mini .plot{border:1px solid var(--line);border-radius:8px;max-width:170px}
.mini figcaption{font-size:.9rem;margin-top:.3em;line-height:1.3}
.mini figcaption b{font-family:var(--math);color:var(--ink);font-size:1.08em}

/* ---------- задания ---------- */
.steps{list-style:none;margin:1em 0 0;padding:0;counter-reset:st;display:grid;gap:10px}
.step{counter-increment:st;position:relative;padding:12px 14px 14px 52px;background:#fff;border:1px solid var(--line);border-radius:10px}
.step::before{content:counter(st);position:absolute;left:12px;top:11px;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#EEF1FA;color:var(--ink);font-size:.9rem}
.step.cur{border-color:var(--ink);box-shadow:0 0 0 2px rgba(28,46,122,.12)}
.step.cur::before{background:var(--ink);color:#fff}
.step.done::before{content:"✓";background:var(--green);color:#fff}
.step.locked{opacity:.5}
.step.locked .btn{pointer-events:none}
.step h3{margin-bottom:.25em}
.step>*+*{margin-top:.55em}
.tblwrap{overflow-x:auto}
table.vals{border-collapse:collapse;font-family:var(--math);font-size:1.08rem;width:100%;table-layout:fixed}
table.vals th,table.vals td{border:1.5px solid #9AA5C6;padding:.3em .15em;text-align:center}
table.vals th{background:#EEF1FA;color:var(--ink);width:2.2em}
table.vals td .in{width:100%;border:0;border-radius:4px;padding:.25em 0;background:#F6F8FD}
.in{width:4.6em;font-family:var(--math);font-size:1.1rem;text-align:center;border:1.5px solid #8F9BC0;border-radius:7px;padding:.32em .2em;background:#fff}
.in.ok,table.vals td .in.ok{background:var(--green-bg);box-shadow:inset 0 0 0 2px var(--green);color:#0d5733}
.in.bad,table.vals td .in.bad{background:var(--red-bg);box-shadow:inset 0 0 0 2px var(--red);text-decoration:underline wavy var(--red)}
.field{display:inline-flex;align-items:center;gap:.4em;font-family:var(--math);font-size:1.2rem;color:var(--ink)}
.q{margin-top:1em}
.q>.qt{font-weight:700;margin-bottom:.4em;display:flex;gap:.5em;align-items:baseline}
.q>.qt .n{display:inline-grid;place-items:center;flex:none;width:1.6em;height:1.6em;border-radius:50%;background:#EEF1FA;color:var(--ink);font-size:.85rem}
.seg{display:inline-flex;flex-wrap:wrap;gap:8px}
.seg-b{border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:8px;padding:.45em 1em;font-family:var(--math);font-size:1.15rem;min-width:4.6em}
.seg-b.txt{font-family:var(--sans);font-size:1rem;font-weight:700}
.seg-b:hover{background:#EEF1FA}
.seg-b[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg.ok .seg-b[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.seg.ok .seg-b[aria-pressed="true"]::before{content:"✓ "}
.seg.bad .seg-b[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.seg.bad .seg-b[aria-pressed="true"]::before{content:"✗ "}
.seg.lock .seg-b{pointer-events:none}
.seg.lock .seg-b[aria-pressed="false"]{opacity:.4}
.fb{margin-top:.9em}
.fb:empty{display:none}
.step .fb{margin-top:.6em}
.fb.ok,.fb.bad,.fb.info,.fb.hint{display:flex;gap:.7em;align-items:flex-start;padding:.7em .9em;border-radius:10px;border:1.5px solid;font-size:.97rem}
.fb .ic{flex:none;width:1.5em;height:1.5em;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.9rem;margin-top:.05em}
.fb.ok{background:var(--green-bg);border-color:var(--green)} .fb.ok .ic{background:var(--green)}
.fb.bad{background:var(--red-bg);border-color:var(--red)} .fb.bad .ic{background:var(--red)}
.fb.info{background:#EEF1FA;border-color:#9AA5C6} .fb.info .ic{background:var(--ink)}
.fb.hint{background:var(--amber-bg);border-color:#D9B44A} .fb.hint .ic{background:var(--amber)}
.fb p+p{margin-top:.35em}
.sol{font-family:var(--math);font-size:1.12rem;line-height:1.9}
.sol .w{font-family:var(--sans);font-size:.9em}
.sol>div{white-space:nowrap;overflow-x:auto}
.actions{margin-top:1.1em}

/* ---------- титул ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(16px,3vw,40px);align-items:center}
.hero h1{font-size:clamp(2.3rem,6.4vw,4.6rem);letter-spacing:-.01em}
.hero .formula{font-size:clamp(1.6rem,3.4vw,2.4rem);margin-top:.5em}
.hero .plot{max-width:420px;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px -24px rgba(28,46,122,.6)}
@media (max-width:860px){.hero{grid-template-columns:1fr}.hero .art{order:-1}.hero .plot{max-width:240px}}
.blocks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:clamp(18px,3vw,34px)}
@media (max-width:980px){.blocks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.blocks{grid-template-columns:1fr}}
.bcard{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:.35em;transition:border-color .15s,transform .15s}
.bcard:hover{border-color:var(--ink);transform:translateY(-2px)}
.bcard .bn{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--red);font-weight:700}
.bcard .bt{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:1.12rem;line-height:1.2}
.bcard .bd{font-size:.88rem;color:var(--muted);flex:1}
.meter{height:6px;border-radius:3px;background:#E6EAF5;overflow:hidden;margin-top:.4em}
.meter>span{display:block;height:100%;background:var(--green);border-radius:3px}
.bcard .bp{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- песочница ---------- */
.sliders{display:grid;gap:.5em;margin-top:.9em}
.sl{display:grid;grid-template-columns:5.2em 1fr;align-items:center;gap:.6em;font-family:var(--math);font-size:1.15rem;color:var(--ink)}
.sl input{width:100%;accent-color:var(--ink);height:1.6em}
.chips{display:grid;gap:6px;margin-top:.9em}
.chip{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:0 8px 8px 0;padding:.4em .7em;font-size:.93rem}
.chip.warn{border-left-color:var(--red);background:var(--red-bg)}
.legend{display:grid;gap:.3em;margin-top:.7em}
.legend b{font-family:var(--math);font-style:italic;color:var(--ink);font-size:1.15em;display:inline-block;min-width:1.2em}

/* ---------- итоги ---------- */
.res{display:grid;gap:10px;margin-top:1.2em}
.resrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px 18px;align-items:center}
@media (max-width:700px){.resrow{grid-template-columns:1fr}}
.resrow .rt{font-family:var(--serif);font-weight:700;color:var(--ink)}
.resrow .rs{font-size:.86rem;color:var(--muted)}
.resrow .meter{height:10px;border-radius:5px;margin:0}
.total{font-family:var(--serif);font-size:clamp(2.4rem,6vw,4rem);color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.total small{font-size:.45em;color:var(--muted);font-family:var(--sans)}
.trainer-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:.4em}
.badge{display:inline-block;background:var(--hl);color:var(--ink);border-radius:999px;padding:.15em .8em;font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums}

@media (max-width:640px){
  .tab .lbl,.tab .cnt{display:none}
  .tab{padding:.28em .32em}
  .tab[aria-current="true"] .lbl{display:inline}
  .tab[aria-current="true"]{padding-right:.8em}
  .bar .btn span.t{display:none}
  .brand{display:none}
  .step{padding-left:14px;padding-top:44px}
  .formula{white-space:normal}
  .sol>div{white-space:normal}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{.top,.bar{display:none}body{height:auto}.stage{overflow:visible}}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="brand" aria-label="На первый слайд">ax² + bx + c</button>
  <nav class="tabs" id="tabs" aria-label="Разделы урока"></nav>
  <button class="icon-btn" id="fs" title="Во весь экран" aria-label="Во весь экран">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6V2h4M12 2h4v4M16 12v4h-4M6 16H2v-4"/></svg>
  </button>
</header>
<main class="stage" id="stage" tabindex="-1"></main>
<footer class="bar">
  <button class="btn ghost" id="prev" aria-label="Предыдущий слайд">← <span class="t">Назад</span></button>
  <div class="mid"><div class="dots" id="dots"></div><div class="pos" id="pos"></div></div>
  <button class="btn" id="next" aria-label="Следующий слайд"><span class="t">Далее</span> →</button>
</footer>
<noscript><p style="padding:20px">Для работы интерактивного урока включите JavaScript.</p></noscript>

<script>
'use strict';
/* =====================================================================
   Квадратный трёхчлен — интерактивный урок. Один файл, без зависимостей.
   ===================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const MINUS = '\u2212';
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- маленькие помощники ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(3)) { if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(k)); }
  return e;
}
function S(tag, attrs, ...kids) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  for (const k of kids.flat()) if (k) e.append(k);
  return e;
}
const R = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const pick = a => a[R(0, a.length - 1)];

/* число → строка по-русски: запятая и настоящий минус */
function fmt(v) {
  v = Math.round(v * 1000) / 1000;
  if (v === 0) v = 0;
  return String(v).replace('.', ',').replace('-', MINUS);
}
const par = v => (v < 0 ? '(' + fmt(v) + ')' : fmt(v));
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
/* p/q → «0,5» или «−1/3» */
function fracStr(p, q) {
  const sign = (p < 0) !== (q < 0) && p !== 0 ? -1 : 1;
  p = Math.abs(p); q = Math.abs(q);
  const g = gcd(p, q); p /= g; q /= g;
  if (q === 1) return fmt(sign * p);
  let t = q; while (t % 2 === 0) t /= 2; while (t % 5 === 0) t /= 5;
  if (t === 1) return fmt(sign * p / q);

const stageEl = document.getElementById('stage'), tabsEl = document.getElementById('tabs'), dotsEl = document.getElementById('dots'),

const cache = new Map();
let cur = 0;

function show() {
  const s = slides[cur];
  cache.forEach(e => e.hidden = true);
  let el = cache.get(s.id);
  if (el && s.fresh) { el.remove(); cache.delete(s.id); el = null; }
  if (!el) { el = h('section', { class: 'slide', 'aria-label': s.name }); cache.set(s.id, el); stageEl.append(el); s.render(el); }
  el.hidden = false;
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  stageEl.scrollTop = 0;
  nextEl.classList.remove('go');
  updateNav();
  try { history.replaceState(null, '', '#' + s.id); } catch (e) {}
}
function go(i) { i = Math.max(0, Math.min(slides.length - 1, i)); if (i === cur && cache.has(slides[i].id) && !slides[i].fresh) return; cur = i; show(); }
function goId(id) { const i = slides.findIndex(s => s.id === id); if (i >= 0) { cur = i; show(); } }

function updateNav() {
  const s = slides[cur];
  tabsEl.replaceChildren(...SECTIONS.map(sec => {
    const st = sec.block ? blockStat(sec.block) : null;
    const t = h('button', { class: 'tab' + (st && st.ok === st.n ? ' full' : ''), type: 'button', 'aria-current': sec.n === s.sec ? 'true' : 'false',
      title: sec.block ? 'Блок ' + sec.n + '. ' + sec.block.title : sec.label,
      onclick: () => go(slides.findIndex(x => x.sec === sec.n)) },
      h('span', { class: 'num' }, sec.num), h('span', { class: 'lbl' }, sec.label), st ? h('span', { class: 'cnt' }, st.ok + '/' + st.n) : null);
    return t;
  }));
  const curTab = tabsEl.querySelector('[aria-current="true"]');
  if (curTab && curTab.scrollIntoView) try { curTab.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {}
  dotsEl.replaceChildren(...slides.map((x, i) => {
    if (x.sec !== s.sec) return null;
    const p = x.task && progress[x.id];
    return h('button', { class: 'dot' + (p ? ' ' + p.st : ''), type: 'button', 'aria-current': i === cur ? 'true' : 'false',
      'aria-label': x.name + (p ? (p.st === 'ok' ? ' — решено' : ' — открыто решение') : ''), title: x.name, onclick: () => go(i) }, x.dot);
  }).filter(Boolean));
  const curDot = dotsEl.querySelector('[aria-current="true"]');
  if (curDot && curDot.scrollIntoView) try { curDot.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {}
  posEl.textContent = 'Слайд ' + (cur + 1) + ' из ' + slides.length;
  prevEl.disabled = cur === 0; nextEl.disabled = cur === slides.length - 1;
}

prevEl.addEventListener('click', () => go(cur - 1));
nextEl.addEventListener('click', () => go(cur + 1));
document.getElementById('brand').addEventListener('click', () => go(0));
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target.closest && e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
});
const fsBtn = document.getElementById('fs');
if (!document.fullscreenEnabled) fsBtn.hidden = true;
fsBtn.addEventListener('click', () => {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
});
function fromHash() { let id = ''; try { id = decodeURIComponent(location.hash.replace(/^#\/?/, '')); } catch (e) {} const i = slides.findIndex(s => s.id === id); return i; }
window.addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0 && i !== cur) { cur = i; show(); } });
cur = Math.max(0, fromHash());
show();
</script>
</body>
</html>
